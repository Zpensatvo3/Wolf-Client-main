name: Build Onestep

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Validate auth configuration and Worker locally
        run: |
          python scripts/Test-AuthConfiguration.py
          npm ci --prefix server
          npm test --prefix server
          npm run test:v2 --prefix server
          npm run test:v2:runtime --prefix server
          npm run test:runtime --prefix server
      - name: Validate infrastructure and source boundaries
        run: |
          python scripts/Test-Infrastructure.py
          python -m unittest discover -s tests -p 'test_repository_hygiene.py' -v
          python scripts/Test-AimAssistSources.py
          python scripts/Test-TriggerbotSources.py
          python scripts/Test-JumpResetSources.py
      - name: Check original hybrid game bridge offline
        run: python scripts/Test-HybridBridge.py
      - name: Compile and run offline tests
        run: python scripts/Test-Offline.py --jobs 2
      - name: Exercise GrimUI layout and input without Minecraft
        run: python scripts/Test-GrimUI.py
      - name: Test 26.x migration audit helpers without game downloads
        run: |
          python -m unittest discover -s tests -p 'test_minecraft*.py' -v
          for target in 26.1 26.1.1 26.1.2; do
            python scripts/Test-Minecraft261Offline.py --target "$target"
          done
      - name: Check JNI owner isolation in a disposable JVM
        run: |
          g++ -std=c++20 -pthread -UNDEBUG -Iinclude/jni -Iinclude/jni/linux tests/jni_owner_jvm_test.cpp \
            -L"$JAVA_HOME/lib/server" -Wl,-rpath,"$JAVA_HOME/lib/server" -ljvm -o "$RUNNER_TEMP/onestep-jni-owner-test"
          "$RUNNER_TEMP/onestep-jni-owner-test"
      - name: Check additional Minecraft target SDKs
        run: |
          for target in 1.21.4 1.21.8 1.21.11 26.1 26.1.1 26.1.2; do
            python scripts/Test-Offline.py --test minecraft_version --test sdk_mappings --minecraft-version "$target" --jobs 2
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check Java 25 attach and JVMTI lifecycle without Minecraft
        run: python scripts/Test-JvmLifecycle.py --java-home "$JAVA_HOME"

  windows-dll:
    needs: offline-tests
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.1'
            artifact: Onestep-Windows-x64
            dll: build/Onestep.dll
          - minecraft: '1.21.4'
            artifact: Onestep-1.21.4-Windows-x64
            dll: build/minecraft/1.21.4/Onestep.dll
          - minecraft: '1.21.8'
            artifact: Onestep-1.21.8-Windows-x64
            dll: build/minecraft/1.21.8/Onestep.dll
          - minecraft: '1.21.11'
            artifact: Onestep-1.21.11-Windows-x64
            dll: build/minecraft/1.21.11/Onestep.dll
          - minecraft: '26.1'
            artifact: Onestep-26.1-Windows-x64
            dll: build/minecraft/26.1/Onestep.dll
          - minecraft: '26.1.1'
            artifact: Onestep-26.1.1-Windows-x64
            dll: build/minecraft/26.1.1/Onestep.dll
          - minecraft: '26.1.2'
            artifact: Onestep-26.1.2-Windows-x64
            dll: build/minecraft/26.1.2/Onestep.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Release x64
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Clean -SkipSign -PlatformToolset v143 -MinecraftVersion '${{ matrix.minecraft }}'
      - name: Publish DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dll }}
          if-no-files-found: error
          retention-days: 14

  windows-launcher:
    needs: offline-tests
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher and native permission checks
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $builder = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $builder launcher/launcher.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /v:minimal /nologo
          if ($LASTEXITCODE) { throw 'Launcher build failed' }
          & $builder tests/auth_v2_native.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=v143 /v:minimal /nologo
          if ($LASTEXITCODE) { throw 'Native permission test build failed' }
          & ./build/launcher-v2/tests/auth-v2-test.exe
          if ($LASTEXITCODE) { throw 'Native permission test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: OneStep-Launcher-Windows-x64
          path: build/launcher/Onestep-Launcher.exe
          if-no-files-found: error
          retention-days: 14
