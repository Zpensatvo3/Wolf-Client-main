name: Build Onestep

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate infrastructure and source boundaries
        run: |
          python scripts/Test-Infrastructure.py
          python -m unittest discover -s tests -p 'test_repository_hygiene.py' -v
          python scripts/Test-AimAssistSources.py
          python scripts/Test-TriggerbotSources.py
          python scripts/Test-JumpResetSources.py
      - name: Check original hybrid game bridge offline
        run: python scripts/Test-HybridBridge.py
      - name: Verify Anchor tick and item-use bytecode hooks
        run: |
          mkdir -p "$RUNNER_TEMP/anchor-asm"
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.9/asm-9.9.jar -o "$RUNNER_TEMP/anchor-asm/asm.jar"
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.9/asm-tree-9.9.jar -o "$RUNNER_TEMP/anchor-asm/asm-tree.jar"
          python scripts/Test-AnchorHooks.py --asm-classpath "$RUNNER_TEMP/anchor-asm/asm.jar:$RUNNER_TEMP/anchor-asm/asm-tree.jar"
          python scripts/Test-AutoTotem.py --asm-classpath "$RUNNER_TEMP/anchor-asm/asm.jar:$RUNNER_TEMP/anchor-asm/asm-tree.jar"
      - name: Compile and run offline tests
        run: |
          python scripts/Test-Offline.py --jobs 2
          python scripts/Test-SpotifyTexture.py
          python scripts/Test-ClientConsistency.py
          python scripts/Test-VisualRuntime.py
          python scripts/Test-NametagJvm.py --java-home "$JAVA_HOME"
      - name: Compile and render Sky shaders on EGL
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri
          python -m pip install moderngl==5.12.0 glcontext==3.0.0
          python scripts/Test-SkyShader.py
      - name: Check local profile persistence
        run: |
          g++ -std=c++20 -Wall -Wextra -pthread tests/local_config_service_test.cpp src/configs/configs.cpp -o "$RUNNER_TEMP/local-config-test"
          "$RUNNER_TEMP/local-config-test" "$RUNNER_TEMP/local-config-profiles"
          g++ -std=c++20 -Wall -Wextra tests/config_page_model_test.cpp -o "$RUNNER_TEMP/config-page-model-test"
          "$RUNNER_TEMP/config-page-model-test"
      - name: Exercise GrimUI layout and input without Minecraft
        run: python scripts/Test-GrimUI.py
      - name: Test 26.x migration audit helpers without game downloads
        run: |
          python -m unittest discover -s tests -p 'test_minecraft*.py' -v
          for target in 26.1 26.1.1 26.1.2; do
            python scripts/Test-Minecraft261Offline.py --target "$target"
          done
      - name: Check JNI owner isolation in a disposable JVM
        run: |
          g++ -std=c++20 -pthread -UNDEBUG -Iinclude/jni -Iinclude/jni/linux tests/jni_owner_jvm_test.cpp \
            -L"$JAVA_HOME/lib/server" -Wl,-rpath,"$JAVA_HOME/lib/server" -ljvm -o "$RUNNER_TEMP/onestep-jni-owner-test"
          "$RUNNER_TEMP/onestep-jni-owner-test"
      - name: Check additional Minecraft target SDKs
        run: |
          for target in 1.21.4 1.21.8 1.21.11 26.1 26.1.1 26.1.2; do
            python scripts/Test-Offline.py --test minecraft_version --test sdk_mappings --minecraft-version "$target" --jobs 2
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check Java 25 attach and JVMTI lifecycle without Minecraft
        run: python scripts/Test-JvmLifecycle.py --java-home "$JAVA_HOME"

  windows-dll:
    needs: offline-tests
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.1'
            artifact: Onestep-Windows-x64
            dll: build/Onestep.dll
          - minecraft: '1.21.4'
            artifact: Onestep-1.21.4-Windows-x64
            dll: build/minecraft/1.21.4/Onestep.dll
          - minecraft: '1.21.8'
            artifact: Onestep-1.21.8-Windows-x64
            dll: build/minecraft/1.21.8/Onestep.dll
          - minecraft: '1.21.11'
            artifact: Onestep-1.21.11-Windows-x64
            dll: build/minecraft/1.21.11/Onestep.dll
          - minecraft: '26.1'
            artifact: Onestep-26.1-Windows-x64
            dll: build/minecraft/26.1/Onestep.dll
          - minecraft: '26.1.1'
            artifact: Onestep-26.1.1-Windows-x64
            dll: build/minecraft/26.1.1/Onestep.dll
          - minecraft: '26.1.2'
            artifact: Onestep-26.1.2-Windows-x64
            dll: build/minecraft/26.1.2/Onestep.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Release x64
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Clean -SkipSign -PlatformToolset v143 -MinecraftVersion '${{ matrix.minecraft }}'
      - name: Publish DLL
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dll }}
          if-no-files-found: error
          retention-days: 14
