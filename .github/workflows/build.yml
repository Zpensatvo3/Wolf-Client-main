name: Build Onestep

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Validate auth configuration and Worker locally
        run: |
          python scripts/Test-AuthConfiguration.py
          npm ci --prefix server
          npm test --prefix server
          npm run test:runtime --prefix server
      - name: Validate infrastructure and source boundaries
        run: |
          python scripts/Test-Infrastructure.py
          python scripts/Test-AimAssistSources.py
          python scripts/Test-TriggerbotSources.py
          python scripts/Test-JumpResetSources.py
      - name: Compile and run offline tests
        run: python scripts/Test-Offline.py --jobs 2

  windows-dll:
    needs: offline-tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Release x64
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -Clean -SkipSign -PlatformToolset v143
      - name: Publish DLL
        uses: actions/upload-artifact@v4
        with:
          name: Onestep-Windows-x64
          path: build/Onestep.dll
          if-no-files-found: error
          retention-days: 14
